[package]
name = "shellora"
version = "1.0.1"
default-run = "shellora"
description = "Cross-platform SSH terminal and dual-pane SFTP manager"
edition = "2021"
rust-version = "1.85"

[features]
default = []
# 开发夹具（本地 SSH/SFTP 服务）不进入正式构建，避免被 bundler 当作 external binary 打包。
fixture = []

[[bin]]
name = "fixture_sshd"
path = "src/bin/fixture_sshd.rs"
required-features = ["fixture"]

[lib]
name = "shellora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
incremental = true

[dependencies]
async-trait = "0.1.92"
data-encoding = "2.9"
futures-util = "0.3.34"
md5 = "0.7.0"
portable-pty = "0.9.0"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
russh = "0.49"
russh-sftp = "3.0.1"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ssh-key = "0.6"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.20.0", features = ["v7", "serde"] }
zeroize = "1.8.2"

[dev-dependencies]
hmac = "0.12"
sha1 = "0.10"
tokio-stream = "0.1"
