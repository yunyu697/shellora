name: ci

# 常规代码健康检查：push 主分支、PR、手动触发。
# 打包与签名仍在 release.yml 中，仅由 v* tag 或手动发布触发，两者不重复跑重活。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm tsc --noEmit

      - name: 间距令牌检查
        run: pnpm lint:spacing

      - name: 版本一致性检查
        run: pnpm lint:version

      - name: 未翻译字符串检查
        run: pnpm lint:i18n

      - name: 单元测试
        run: pnpm vitest run

      - name: 前端构建
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri v2 在 Linux 上需要 webkit2gtk 与 GTK 等系统库；Windows / macOS 无需此步。
      - name: 安装 Tauri Linux 前置
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev libsecret-1-dev

      - name: Rust 单元测试
        working-directory: src-tauri
        run: cargo test --lib

      - name: Rust 类型检查
        working-directory: src-tauri
        run: cargo check
