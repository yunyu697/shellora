name: release

# Windows / macOS / Linux 打包矩阵。本机只验证了 Windows；macOS 与 Linux 通过本工作流在
# GitHub 托管 runner 上构建，本地未构建（脚本见 scripts/build-release.sh）。
#
# 触发：
#   - push tag v*         -> 构建 + 发布 GitHub Release
#   - workflow_dispatch   -> 只构建并上传 artifact（不发布）

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    env:
      # secrets 不能直接用于 if 条件，这里转成 job 级 env 再判断。
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 版本一致性（Cargo.toml / package.json / tauri.conf.json）
        run: node scripts/check-version.mjs

      - run: pnpm install --frozen-lockfile

      - name: 构建 NSIS + MSI
        # Authenticode 签名需要代码签名证书：设置 WINDOWS_CERTIFICATE_* 并在
        # tauri.conf.json 的 bundle.windows 配置 certificateThumbprint 后启用。
        # Updater 签名使用独立的 TAURI_SIGNING_PRIVATE_KEY；未配置时关闭 updater 产物，
        # 保证未签名构建仍可完成（Release 会自动跳过 latest.json）。
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $cfg = '{"bundle":{"createUpdaterArtifacts":false}}'
          if ($env:HAS_UPDATER_KEY -eq 'true') { $cfg = '{"bundle":{"createUpdaterArtifacts":true}}' }
          pnpm tauri build --bundles nsis,msi --config $cfg

      - name: 静默安装 / --version / 健康检查 / 静默卸载冒烟
        shell: pwsh
        run: ./scripts/smoke-windows.ps1

      - name: 生成 SHA-256 清单
        run: node scripts/release-manifest.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            docs/release/manifest-*.json
            docs/release/manifest-*.md

  macos:
    runs-on: macos-14
    env:
      # secrets 不能直接用于 if 条件，这里转成 job 级 env 再判断。
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 版本一致性
        run: node scripts/check-version.mjs

      - run: pnpm install --frozen-lockfile

      # 签名与公证：配置 APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
      # APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID 后生效；
      # 未配置时走未签名分支，避免空的 APPLE_CERTIFICATE 触发 security import 失败。
      - name: 构建 universal .app + .dmg（已签名）
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          CFG='{"bundle":{"createUpdaterArtifacts":false}}'
          if [ "$HAS_UPDATER_KEY" = "true" ]; then CFG='{"bundle":{"createUpdaterArtifacts":true}}'; fi
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg --config "$CFG"

      - name: 构建 universal .app + .dmg（未签名）
        if: env.HAS_APPLE_CERT != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          CFG='{"bundle":{"createUpdaterArtifacts":false}}'
          if [ "$HAS_UPDATER_KEY" = "true" ]; then CFG='{"bundle":{"createUpdaterArtifacts":true}}'; fi
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg --config "$CFG"

      - name: 生成 SHA-256 清单
        run: node scripts/release-manifest.mjs --dir src-tauri/target/universal-apple-darwin/release/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig
            docs/release/manifest-*.json
            docs/release/manifest-*.md

  linux:
    runs-on: ubuntu-22.04
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装 Tauri Linux 前置（webkit2gtk-4.1）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev file rpm

      - name: 版本一致性
        run: node scripts/check-version.mjs

      - run: pnpm install --frozen-lockfile

      - name: 构建 AppImage + deb + rpm
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          CFG='{"bundle":{"createUpdaterArtifacts":false}}'
          if [ "$HAS_UPDATER_KEY" = "true" ]; then CFG='{"bundle":{"createUpdaterArtifacts":true}}'; fi
          pnpm tauri build --bundles appimage,deb,rpm --config "$CFG"

      - name: 生成 SHA-256 清单
        run: node scripts/release-manifest.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.sig
            docs/release/manifest-*.json
            docs/release/manifest-*.md

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 校验 tag 与版本一致
        run: |
          APP_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          test "${GITHUB_REF_NAME#v}" = "$APP_VERSION" || {
            echo "tag ${GITHUB_REF_NAME} 与版本 $APP_VERSION 不一致";
            exit 1;
          }

      - name: 生成 latest.json（应用内更新清单）
        # 需要签名产物（*.sig）。未配置 TAURI_SIGNING_PRIVATE_KEY 时脚本自动跳过，
        # Release 仍会正常发布，只是暂不提供应用内更新。
        run: |
          node scripts/updater-manifest.mjs --dir artifacts --out artifacts/latest.json
          if [ -f artifacts/latest.json ]; then cat artifacts/latest.json; fi

      - name: 生成三平台合并产物清单
        run: node scripts/release-manifest.mjs --assets artifacts

      - name: 汇总 SHA256SUMS
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.app.tar.gz' -o -name '*.sig' -o -name 'latest.json' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.app.tar.gz
            artifacts/**/*.sig
            docs/release/manifest-${{ env.APP_VERSION }}.json
            docs/release/manifest-${{ env.APP_VERSION }}.md
            artifacts/latest.json
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: false
