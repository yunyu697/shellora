name: runner-probe

# 临时诊断：确认本仓库可用的 macOS 托管 runner 标签。
on:
  workflow_dispatch:

jobs:
  m13:
    runs-on: macos-13
    steps:
      - run: uname -a && sw_vers
  m14:
    runs-on: macos-14
    steps:
      - run: uname -a && sw_vers
  m15:
    runs-on: macos-15
    steps:
      - run: uname -a && sw_vers
  latest:
    runs-on: macos-latest
    steps:
      - run: uname -a && sw_vers
